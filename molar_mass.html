<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Molar Mass Experiment</title>
		<link rel="stylesheet" href="src/styles.css">
		<script type="module">
			import { molarMassExperiment } from "./src/molar_mass/MolarMassExperiment.js";
			molarMassExperiment.start();
		</script>
	</head>

	<body>
		<header>
			<h1>Molar Mass of Butane</h1>
			<p>Collect butane gas over water and use your measurements to find the molar mass of butane.</p>
			<nav aria-label="Experiment sections">
				<ul role="list">
					<li><button type="button" data-view="bench">Lab bench</button></li>
					<li><button type="button" data-view="procedure">Procedure</button></li>
					<li><button type="button" data-view="report">Report</button></li>
				</ul>
			</nav>
		</header>

		<p id="announcer" role="status" aria-live="polite"></p>

		<main id="main"></main>

		<footer>
			<p><a href="index.html">Back to all experiments</a></p>
		</footer>

		<noscript>This experiment requires JavaScript.</noscript>

		<!-- Views are filled in by src/pageBuilder.js. Lists are numbered (<ol>)
		     so it is easy to keep track of position within them. -->
		<template id="bench-view">
			<h2>Lab bench</h2>
			<p>Choose a piece of equipment to use it.</p>
			<ol data-slot="stations" data-item-template="button-item"></ol>
		</template>

		<template id="station-view">
			<h2 data-slot="title"></h2>
			<p data-slot="description"></p>
			<h3>Current state</h3>
			<ol data-slot="state" data-item-template="text-item"></ol>
			<h3>Actions</h3>
			<ol class="actions" data-slot="actions" data-item-template="button-item"></ol>
			<button type="button" data-view="bench">Back to lab bench</button>
		</template>

		<template id="procedure-view">
			<h2>Procedure</h2>
			<p>Each step names the lab bench station where you do it. Record each reading in the Report as you go. Do a practice run first, then trials 1, 2 and 3.</p>
			<ol>
				<li>Read and record the temperature and pressure at the thermometer and barometer.</li>
				<li>Move the water trough to the sink, turn the faucet on and then off at the sink, then move the trough back to the lab bench.</li>
				<li>Place the butane lighter on the scale, read and record its initial mass at the scale, then take the lighter off the scale.</li>
				<li>Attach the tubing to the lighter.</li>
				<li>Move the graduated cylinder to the water trough and turn it upside down under the water.</li>
				<li>Place the tubing outlet under the cylinder.</li>
				<li>Press the butane lighter valve until the cylinder holds 20 to 25 milliliters of gas. Read the graduated cylinder to check, and use a smaller amount per press as you get close.</li>
				<li>Level the water inside the graduated cylinder with the trough water, then read and record the volume of gas.</li>
				<li>Detach the tubing from the lighter, then weigh the lighter again as in step 3 and record its final mass.</li>
				<li>For the next trial, move the graduated cylinder to the lab bench and repeat steps 3 to 9.</li>
				<li>For each run, subtract the vapor pressure of water at room temperature from the room pressure. Use the ideal gas law (R is 62.36 liters torr per mole kelvin) to find the moles of butane, then divide the mass lost by the moles.</li>
				<li>Average trials 1 to 3, then find the percent difference from 58.12 grams per mole and the standard deviation.</li>
			</ol>
		</template>

		<template id="report-view">
			<h2>Report</h2>
			<p>Keep track of your measurements and calculations here as you work through the trials. Nothing is calculated or checked for you. Values are kept while you move between sections, but are cleared if the page is reloaded.</p>

			<h3>Measurements</h3>
			<fieldset>
				<legend>Room conditions</legend>
				<div data-slot="conditions" data-item-template="number-field"></div>
			</fieldset>
			<div data-slot="measurements" data-item-template="trial-fieldset"></div>

			<h3>Calculations</h3>
			<div data-slot="calculations" data-item-template="trial-fieldset"></div>
			<fieldset>
				<legend>Final results</legend>
				<div data-slot="finalResults" data-item-template="number-field"></div>
			</fieldset>

			<button type="button" data-click="clear">Clear report</button>
		</template>

		<template id="trial-fieldset">
			<fieldset>
				<legend data-slot="legend"></legend>
				<div data-slot="fields" data-item-template="number-field"></div>
			</fieldset>
		</template>

		<!-- type="text" with inputmode="decimal" avoids the accessibility
		     problems of type="number" while still showing a number keypad. -->
		<template id="number-field">
			<div class="field">
				<label data-slot="label" data-attr-for="id"></label>
				<input type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
					data-attr-id="id" data-attr-value="value" data-attr-aria-invalid="invalid"
					data-attr-aria-describedby="describedBy" data-input="input" data-change="change">
				<p class="error" data-attr-id="errorId" data-slot="error"></p>
			</div>
		</template>

		<template id="text-item">
			<li data-slot="text"></li>
		</template>

		<template id="button-item">
			<li><button type="button" data-slot="label" data-click="click"></button></li>
		</template>

		<!-- A dropdown and the button it applies to. The dropdown only stores
		     the choice; nothing happens until the button is pressed (WCAG 3.2.2). -->
		<template id="select-action-item">
			<li class="select-action">
				<label data-slot="selectLabel" data-attr-for="selectId"></label>
				<select data-attr-id="selectId" data-slot="options" data-item-template="option-item" data-change="change"></select>
				<button type="button" data-slot="label" data-click="click"></button>
			</li>
		</template>

		<template id="option-item">
			<option data-slot="text" data-attr-value="value" data-attr-selected="selected"></option>
		</template>
	</body>
</html>
